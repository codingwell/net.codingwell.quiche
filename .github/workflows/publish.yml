name: Publish

# Builds the net.codingwell.quiche nupkg for all major RIDs and, on a
# version tag, publishes it to NuGet.org via Trusted Publishing (OIDC).
# No long-lived API key is stored anywhere: the publish job exchanges
# a GitHub OIDC token for a ~1-hour NuGet API key immediately before
# pushing, using NuGet/login@v1. The id-token: write permission is
# granted to the publish job only, never to the build jobs.
#
# BEFORE THE FIRST PUBLISH, two one-time setup steps (both outside
# this repo — this workflow alone cannot do them):
#
#   1. nuget.org → Trusted Publishing → add a policy, owned by
#      the NuGet.org organization that owns net.codingwell.quiche
#      (NOT a personal account — see NUGET_USER below):
#        Package Owner:    the org that owns net.codingwell.quiche
#        Repository Owner: codingwell   (GitHub repo owner — this is
#                                        a different namespace from
#                                        the NuGet package owner)
#        Repository:       net.codingwell.quiche
#        Workflow File:    publish.yml        (file name only, and
#                                             it must match this file)
#        Environment:      (leave empty — this workflow uses none)
#      The policy must be created by an admin/member of that org.
#      Until the policy exists, the publish job will fail at the
#      login step; the build/pack jobs still run and upload the
#      nupkg as an artifact.
#
#   2. GitHub repo → Settings → Secrets → Actions → add:
#        NUGET_USER = the NuGet.org organization name (NOT your
#        personal username, NOT your email)
#      NuGet/login exchanges the OIDC token for a temporary API key
#      issued to that account, and the key must belong to the
#      account that owns the package — the org. A personal
#      username here would get a key for an account that does not
#      own net.codingwell.quiche, so the push would be refused.
#
# Triggers and versioning:
#   - Push a tag like v0.1.0 → build, pack, and publish that version.
#     The tag (minus the leading v) is the version of record and
#     overrides the csproj <Version>; the tag and the package must
#     never disagree, so do not push a tag for a version already on
#     NuGet.org (a duplicate push fails loudly, by design — there is
#     deliberately no --skip-duplicate here).
#   - workflow_dispatch → build and pack only, uploading the nupkg
#     as an artifact, unless the `publish` input is set to true (a
#     manual publish from a branch, e.g. to test the policy) and
#     `version` is given.
#
# The native matrix below mirrors .github/workflows/native.yml
# (same RIDs, runners, targets, and toolchain steps). If that matrix
# changes, this one must change with it — the pack job fails if any
# of the 7 RIDs is missing from the staging dir.
#
# RIDs: win-x64, win-arm64, linux-x64, linux-arm64, linux-musl-x64,
# osx-x64, osx-arm64. linux-musl-arm64 is absent for the same reason
# as in native.yml: rustc drops cdylib for aarch64-unknown-linux-musl.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pack (e.g. 0.1.0-alpha.2). Empty = csproj version."
        required: false
        type: string
      publish:
        description: "Also publish to NuGet.org via Trusted Publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: quiche (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - rid: win-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
          - rid: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - rid: linux-musl-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - rid: osx-x64
            runner: macos-15
            target: x86_64-apple-darwin
          - rid: osx-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install NASM and LLVM (Windows)
        if: startsWith(matrix.runner, 'windows')
        run: choco install nasm llvm -y

      - name: Set up MSVC (Windows)
        if: startsWith(matrix.runner, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch || 'x64' }}

      - name: Install Zig (musl)
        if: matrix.musl
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild (musl)
        if: matrix.musl
        run: cargo install cargo-zigbuild --locked

      - name: Install cmake and libclang (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake libclang-dev

      # Windows builds run under PowerShell via build.ps1, NOT under
      # Git Bash (see native/build.ps1 header and native.yml).
      - name: Build quiche for ${{ matrix.rid }} (Windows)
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: .\native\build.ps1 -Rid ${{ matrix.rid }}

      - name: Build quiche for ${{ matrix.rid }}
        if: "!startsWith(matrix.runner, 'windows')"
        shell: bash
        run: bash native/build.sh ${{ matrix.rid }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiche-${{ matrix.rid }}
          path: native/out/${{ matrix.rid }}/
          if-no-files-found: error

  pack:
    name: Pack nupkg
    runs-on: ubuntu-24.04
    needs: native
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: quiche-*
          path: native-artifacts

      - name: Stage natives for packing
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 linux-musl-x64 osx-x64 osx-arm64; do
            case "$rid" in
              win-*) lib="quiche.dll" ;;
              osx-*) lib="libquiche.dylib" ;;
              *) lib="libquiche.so" ;;
            esac
            src="native-artifacts/quiche-$rid"
            dst="native/pack/runtimes/$rid/native"
            mkdir -p "$dst"
            cp "$src"/* "$dst"/
            for f in "$lib" LICENSE-quiche.txt LICENSE-boringssl.txt; do
              if [[ ! -f "$dst/$f" ]]; then
                echo "FATAL: $rid is missing $f in its native artifact" >&2
                exit 1
              fi
            done
            echo "staged $rid: $lib + licenses"
          done

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "packing version: ${version:-<csproj Version>}"

      - name: Pack
        shell: bash
        run: |
          args=""
          if [[ -n "${{ steps.version.outputs.version }}" ]]; then
            args="-p:Version=${{ steps.version.outputs.version }}"
          fi
          # shellcheck disable=SC2086
          dotnet pack src/Quiche.NET/Quiche.NET.csproj -c Release -o artifacts $args

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          nupkg=$(ls artifacts/*.nupkg)
          echo "package: $nupkg"
          unzip -l "$nupkg"
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 linux-musl-x64 osx-x64 osx-arm64; do
            case "$rid" in
              win-*) lib="quiche.dll" ;;
              osx-*) lib="libquiche.dylib" ;;
              *) lib="libquiche.so" ;;
            esac
            unzip -l "$nupkg" | grep -q "runtimes/$rid/native/$lib" \
              || { echo "FATAL: package is missing runtimes/$rid/native/$lib" >&2; exit 1; }
          done
          unzip -l "$nupkg" | grep -q "README.md" \
            || { echo "FATAL: package is missing README.md" >&2; exit 1; }
          unzip -p "$nupkg" "*.nuspec" | grep -E "<id>|<version>"
          echo "package verification passed: all 7 RIDs + README present"

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org (Trusted Publishing)
    runs-on: ubuntu-24.04
    needs: pack
    if: github.ref_type == 'tag' || inputs.publish == true
    permissions:
      contents: read
      id-token: write # OIDC only here, immediately before the push
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download nupkg artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      # Temp key is valid ~1 hour and single-use per OIDC token:
      # request it here, push immediately, nothing in between.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
